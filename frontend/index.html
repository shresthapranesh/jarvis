<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell paint under the notch/home indicator; the
         env(safe-area-inset-*) padding (theme/tokens.stylex.ts `css`) keeps content off them.
         interactive-widget=resizes-content shrinks the layout viewport when the virtual
         keyboard opens, so the composer stays visible. Safari ignores the latter — the
         visualViewport listener in __root.tsx covers it there via --kb-inset. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Assistant</title>
    <!-- Dark is the default and matches the manifest's background_color, so the
         standalone splash does not flash. The pre-paint script below corrects it
         when the resolved theme is light; __root.tsx keeps it in sync after that,
         sourcing the value from --pp-bg so the colour is defined only in CSS. -->
    <meta name="theme-color" content="#111113" />
    <script>
      // Resolve theme before first paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          // Stylesheets have not loaded yet, so --pp-bg is not readable here;
          // this one literal must track :root[data-theme='light'] --pp-bg in
          // src/base.css, which in turn tracks `colors.bg` in the light theme.
          if (t === 'light') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f2ed');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d0d'/%3E%3Cline x1='10' y1='16' x2='16' y2='9' stroke='%234f9cf9' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='10' y1='16' x2='16' y2='23' stroke='%234f9cf9' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='16' y1='9' x2='22' y2='13' stroke='%234f9cf9' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='16' y1='23' x2='22' y2='19' stroke='%234f9cf9' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='16' r='3' fill='%234f9cf9'/%3E%3Ccircle cx='16' cy='9' r='2.5' fill='%2322c55e'/%3E%3Ccircle cx='16' cy='23' r='2.5' fill='%2322c55e'/%3E%3Ccircle cx='22' cy='13' r='2' fill='%23a78bfa'/%3E%3Ccircle cx='22' cy='19' r='2' fill='%23a78bfa'/%3E%3C/svg%3E" />

    <!-- PWA. The icons are generated by frontend/scripts/generate_icons.py from
         the same geometry as the favicon above — regenerate there, not by hand. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS reads none of the manifest's icons; this link is the home-screen
         icon on iPhone/iPad, and it must be a real PNG (no SVG, no data URI). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Both names on purpose. `mobile-web-app-capable` is the standard one and
         the only one Chrome accepts — it warns that the apple- name is
         deprecated. But iOS Safari reads only the apple- name, so dropping it
         breaks standalone launch there. Neither is redundant with the manifest's
         `display: standalone` on the versions that still need them. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <!-- Deliberately NOT black-translucent: that pins the status-bar text to
         white, which disappears against this app's light theme (#f4f2ed). With
         `default`, iOS tints the bar from theme-color instead — which __root.tsx
         keeps synced to --bg, so the bar tracks whichever theme is active. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
