type InterruptResolvedEvent {
  interruptId: String!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type Memory {
  content: String!
  exists: Boolean!
  modifiedAt: String
}

type MemoryItem {
  id: String!
  kind: String!
  text: String!
  updatedAt: String!
}

type Message implements Node {
  """The Globally Unique ID of this object"""
  id: ID!
  role: String!
  content: String!
  model: String
  status: String!
  inputTokens: Int
  outputTokens: Int
  createdAt: DateTime!
  steps: [Step!]!
}

type MessageConnection {
  edges: [MessageEdge!]!
  pageInfo: PageInfo!
}

type MessageEdge {
  node: Message!
  cursor: String!
}

type ModelCatalog {
  default: String!
  available: [ModelSpec!]!
}

type ModelSpec {
  id: String!
  label: String!
  provider: String!
}

type Mutation {
  updateMemory(content: String!): Memory!
  consolidateMemory(model: String = null): String!
  addMemory(text: String!, kind: String! = "fact"): MemoryItem!
  updateMemoryItem(id: String!, text: String!, kind: String = null): MemoryItem!
  deleteMemory(id: String!): Boolean!
  startTask(input: StartTaskInput!): StartTaskPayload!
  stopTask(taskId: String!): Boolean!
  resumeTask(taskId: String!, answer: String!): Boolean!
  updateConversation(id: ID!, title: String = null, model: String = null, pinned: Boolean = null): Conversation!
  deleteConversation(id: ID!): Boolean!
  updateArtifact(id: ID!, title: String = null, content: String = null): Artifact!
  deleteArtifact(id: ID!): Boolean!
  deleteDocument(id: ID!): Boolean!
  createAutomation(input: AutomationInput!): Automation!
  updateAutomation(id: ID!, input: AutomationInput!): Automation!
  deleteAutomation(id: ID!): Boolean!
  triggerAutomation(id: ID!): String!
  stopAutomationRun(runId: String!): Boolean!
  createBoardTask(input: BoardTaskInput!): BoardTask!
  updateBoardTask(id: ID!, input: BoardTaskUpdateInput!): BoardTask!
  setBoardTaskStatus(id: ID!, status: String!): BoardTask!
  decomposeBoardTask(id: ID!): [BoardTask!]!
  answerBoardTask(id: ID!, answer: String!): BoardTask!
  deleteBoardTask(id: ID!): Boolean!
  stopBoardTask(id: ID!): Boolean!
  createWorkflow(input: WorkflowCreateInput!): Workflow!
  updateWorkflow(id: ID!, input: WorkflowUpdateInput!): Workflow!
  deleteWorkflow(id: ID!): Boolean!
  runWorkflow(id: ID!, inputs: JSON = null): String!
  stopWorkflowRun(runId: String!): Boolean!
  createNotificationChannel(input: NotificationChannelCreateInput!): NotificationChannel!
  updateNotificationChannel(id: ID!, input: NotificationChannelUpdateInput!): NotificationChannel!
  deleteNotificationChannel(id: ID!): Boolean!
  createSkill(input: SkillCreateInput!): Skill!
  updateSkill(id: ID!, input: SkillUpdateInput!): Skill!
  deleteSkill(id: ID!): Boolean!
  stopRunningTask(taskId: String!): StopRunningTaskPayload!
}

"""An object with a Globally Unique ID"""
interface Node {
  """The Globally Unique ID of this object"""
  id: ID!
}

type NotificationChannel implements Node {
  """The Globally Unique ID of this object"""
  id: ID!
  name: String!
  type: String!
  target: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input NotificationChannelCreateInput {
  name: String!
  type: String!
  target: String!
}

input NotificationChannelUpdateInput {
  name: String = null
  type: String = null
  target: String = null
}

"""Information to aid in pagination."""
type PageInfo {
  """When paginating forwards, are there more items?"""
  hasNextPage: Boolean!

  """When paginating backwards, are there more items?"""
  hasPreviousPage: Boolean!

  """When paginating backwards, the cursor to continue."""
  startCursor: String

  """When paginating forwards, the cursor to continue."""
  endCursor: String
}

type Query {
  models: ModelCatalog!
  agentMemory: Memory!
  memories(kind: String = null): [MemoryItem!]!
  node(
    """The ID of the object."""
    id: ID!
  ): Node!
  conversations(surface: String = "web"): [Conversation!]!
  conversation(id: ID!): Conversation
  todos(conversationId: String!): [TodoItem!]!
  artifacts(conversationId: String = null): [Artifact!]!
  artifact(id: ID!): Artifact
  documents(conversationId: String!): [Document!]!
  automations: [Automation!]!
  automation(id: ID!): Automation
  automationRuns(automationId: ID!): [AutomationRun!]!
  boardTasks(includeArchived: Boolean! = false): [BoardTask!]!
  boardTask(id: ID!): BoardTask
  workflows: [Workflow!]!
  workflow(id: ID!): Workflow
  workflowRuns(workflowId: ID!): [WorkflowRun!]!
  workflowRun(id: ID!): WorkflowRun
  notificationChannels: [NotificationChannel!]!
  skills: [Skill!]!
  runningTasks: [RunningTask!]!
}

