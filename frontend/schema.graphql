union ChatEvent = TokenEvent | ThinkingTokenEvent | StepEvent | BrowserStepEvent | ArtifactEvent | TodosUpdatedEvent | InterruptEvent | InterruptResolvedEvent | SafetyInputBlockedEvent | SafetyOutputBlockedEvent | DoneEvent | StoppedEvent | ErrorEvent

