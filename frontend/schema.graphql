}

type Automation implements Node {
  """The Globally Unique ID of this object"""
  id: ID!
  name: String!
  description: String
  inputType: String!
  promptText: String
  model: String
  codeText: String
  webhookUrl: String
  webhookMethod: String
  webhookHeaders: String
  webhookBody: String
  schedule: String
