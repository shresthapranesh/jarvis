[package]
name = "jarvis-edge"
version = "0.1.0"
edition = "2024"
# The resolver picks dependency versions this toolchain can build, so a
# fresh `cargo build` doesn't drift onto crates that need a newer rustc.
rust-version = "1.88"
publish = false

[dependencies]
async-graphql = { version = "7", default-features = false }
# The parser's non-const Value (it can hold $variables) isn't re-exported.
async-graphql-value = "7"
# The subscription WebSocket (graphql-ws and graphql-transport-ws).
async-graphql-axum = "7"
# multipart: `POST /uploads` (`rest.rs`).
axum = { version = "0.8", features = ["ws", "multipart"] }
async-stream = "0.3"
base64 = "0.22"
# The chunks of a streamed model reply (`llm/lines.rs`).
bytes = "1"
# Timestamps for rows the edge writes, in SQLAlchemy's stored format.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Cron schedules run in the user's zone, DST included (`cron.rs`).
chrono-tz = "0.10"
iana-time-zone = "0.1"
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# rustls: the bots talk to Telegram and Discord over HTTPS (`bots/`);
# multipart: a voice note goes to Python's /transcribe; socks: TELEGRAM_PROXY_URL.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "multipart", "socks"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: event payloads are re-serialized the way Python does it,
# and Python keeps dict insertion order.
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
# Signalling the worker's process group (`supervisor.rs`).
libc = "0.2"
# The SPA's file paths, as Python decoded them.
percent-encoding = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "fs"] }
# rustls: the Discord gateway (`bots/discord.rs`).
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
# The Jupyter wire protocol to the agent's kernels (`kernels/`): pure Rust, so no
# libzmq to build on the old machines this runs on. ipc only — unix sockets.
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "ipc-transport"] }
# Signing kernel messages (HMAC-SHA256 over each part).
hmac = "0.12"
sha2 = "0.10"
# Starlette's FileResponse ETag is an MD5 (`rest.rs`).
md-5 = "0.10"
hex = "0.4.3"
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "serde", "preserve_order", "std_collections"] }
# The command line (`cli/`): `jarvis-edge run|config|model|memory|start`.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "color"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
