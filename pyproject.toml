[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite~=0.22",
    "apscheduler~=3.11",
    "browser-use~=0.11.13",
    "ddgs~=9.14",
    "discord-py~=2.4",
    "fastapi~=0.136",
    "faster-whisper~=1.2",
    "httpx~=0.28",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.9.1",
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.2",
    "langchain-aws~=1.4",
    "langchain-google-genai~=4.2",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-meta>=0.5.0",
    "langchain-ollama~=1.1",
    "langchain-openai~=1.1",
    "langgraph>=1.1.9",
    "langgraph-checkpoint-sqlite~=3.0",
    "langgraph-prebuilt>=1.0.11",
    "mlx-whisper~=0.4",
    "openpyxl~=3.1",
    "piper-tts~=1.4",
    "playwright~=1.58",
    "pypdf~=6.10",
    "python-docx~=1.2",
    "python-dotenv~=1.2",
    "python-multipart~=0.0.26",
    "python-telegram-bot~=22.7",
    "rich~=15.0",
    "sqlalchemy[asyncio]~=2.0",
    "sse-starlette~=3.3",
    "strawberry-graphql[fastapi]>=0.315.5",
    "trafilatura>=2.1.0",
    "typer~=0.24",
    "uvicorn~=0.44",
    "yfinance~=1.3",
]

[project.scripts]
analyzer = "main:app"

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff~=0.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "llm: hits a real model provider; skipped unless credentials are present",
]
filterwarnings = ["ignore::DeprecationWarning"]
