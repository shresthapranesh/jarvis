[project]
name = "jarvis"
version = "0.1.0"
description = "The agent's notebook kernels for jarvis: the jarvis SDK, web and browser tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs~=9.14",
    "httpx~=0.28",
    "ipykernel>=7.3.0",
    "numpy>=2.3",
    "pandas>=3.0",
    "playwright~=1.58",
    "trafilatura>=2.1.0",
    "yfinance~=1.3",
]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "botocore>=1.40",
    "graphql-core>=3.3.0",
    "mcp>=1.20",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "starlette>=1.6.0",
    "uvicorn>=0.52.1",
    "websockets>=15.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "llm: hits a real model provider; skipped unless credentials are present",
]
filterwarnings = ["ignore::DeprecationWarning"]
