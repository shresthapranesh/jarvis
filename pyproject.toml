[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite~=0.22",
    "apscheduler~=3.11",
    "browser-use~=0.11.13",
    "ddgs~=9.14",
    "fastapi~=0.136",
    "faster-whisper~=1.2",
    "httpx~=0.28",
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.2",
    "langchain-aws~=1.4",
    "langchain-google-genai~=4.2",
    "langchain-ollama~=1.1",
    "langchain-openai~=1.1",
    "langgraph>=1.1.9",
    "langgraph-checkpoint-sqlite~=3.0",
    "langgraph-prebuilt>=1.0.11",
    "mlx-whisper~=0.4",
    "openpyxl~=3.1",
    "piper-tts~=1.4",
    "playwright~=1.58",
    "pypdf~=6.10",
    "python-docx~=1.2",
    "python-dotenv~=1.2",
    "python-multipart~=0.0.26",
    "python-telegram-bot~=22.7",
    "rich~=15.0",
    "sqlalchemy[asyncio]~=2.0",
    "sse-starlette~=3.3",
    "typer~=0.24",
    "uvicorn~=0.44",
    "yfinance~=1.3",
]

[project.scripts]
analyzer = "main:app"

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "ruff~=0.15",
]
