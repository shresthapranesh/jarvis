[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "browser-use>=0.11.13",
    "ddgs>=9.12.0",
    "deepagents>=0.4.12",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "langchain-aws>=1.4.3",
    "langchain-google-genai>=4.2.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.12",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "mlx-whisper>=0.4.3",
    "openpyxl>=3.1.5",
    "piper-tts>=1.4.2",
    "playwright>=1.58.0",
    "pypdf>=6.9.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "rich>=13",
    "sqlalchemy[asyncio]>=2.0.47",
    "sse-starlette>=2",
    "typer>=0.15",
    "uvicorn>=0.34",
    "yfinance>=1.2.0",
]

[project.scripts]
analyzer = "main:app"

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]
